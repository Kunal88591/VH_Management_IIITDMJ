# Nginx Configuration for VH Management System
# Location: /etc/nginx/sites-available/vh
# 
# To enable:
#   sudo ln -s /etc/nginx/sites-available/vh /etc/nginx/sites-enabled/vh
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    # Listen on port 80 for both IPv4 and IPv6
    listen 80;
    listen [::]:80;
    
    # Server names - respond to these domains/IPs
    server_name vh.iiitdmj.ac.in 172.27.16.37;

    # Root directory for static frontend files
    root /home/vh/VH_Management_IIITDMJ/frontend/dist;
    
    # Default index file
    index index.html;

    # Maximum upload size (for room images, documents, etc.)
    client_max_body_size 50M;

    # ==========================================
    # FRONTEND STATIC FILES & SPA ROUTING
    # ==========================================
    location / {
        # Try requested URI, then directory, then fallback to index.html for SPA routes
        try_files $uri $uri/ /index.html;
        
        # Cache static assets for 1 year
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Don't cache index.html
        location = /index.html {
            expires 1m;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # ==========================================
    # API REVERSE PROXY TO BACKEND
    # ==========================================
    location /api/ {
        # Proxy configuration
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ==========================================
    # GZIP COMPRESSION
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/atom+xml image/svg+xml application/json;
    gzip_disable "msie6";
    gzip_comp_level 6;

    # ==========================================
    # LOGGING
    # ==========================================
    access_log /var/log/nginx/vh_access.log combined;
    error_log /var/log/nginx/vh_error.log warn;

    # ==========================================
    # ERROR PAGES
    # ==========================================
    # 404 - Serve index.html for SPA routing
    error_page 404 =200 /index.html;
    
    # 500+ errors - Show custom page if available
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ==========================================
    # DENY ACCESS TO SENSITIVE FILES
    # ==========================================
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
    
    location ~ /node_modules/ {
        deny all;
    }
    
    location ~ /backend/ {
        deny all;
    }

    # ==========================================
    # MIME TYPES
    # ==========================================
    # If default mime types are not loaded
    # include /etc/nginx/mime.types;
    # default_type application/octet-stream;

}

